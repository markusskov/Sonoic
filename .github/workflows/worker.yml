name: Worker CI

on:
  pull_request:
    paths:
      - "sonoic-sonos-worker/**"
      - ".github/workflows/worker.yml"
  push:
    branches:
      - main
    paths:
      - "sonoic-sonos-worker/**"
      - ".github/workflows/worker.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sonoic-sonos-worker

jobs:
  worker:
    name: worker-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sonoic-sonos-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run worker tests
        run: npm test -- --run

      - name: Type-check worker
        run: npx tsc --noEmit
